<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Formula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#fff; --ink:#1C1A18; --muted:#8B8279; --hair:#ECE8E3; --tint:#FAF8F6;
    --accent:#C29424; --wash:rgba(194,148,36,0.12); --line:rgba(194,148,36,0.55); }
  body[data-cat="sourdough"]{ --accent:#C29424; --wash:rgba(194,148,36,0.12); --line:rgba(194,148,36,0.55); }
  body[data-cat="yeasted"]  { --accent:#6E8A4C; --wash:rgba(110,138,76,0.12);  --line:rgba(110,138,76,0.55); }
  body[data-cat="pizza"]    { --accent:#B23A2B; --wash:rgba(178,58,43,0.10);   --line:rgba(178,58,43,0.5); }
  body[data-cat="pastry"]   { --accent:#D67B2C; --wash:rgba(214,123,44,0.12);  --line:rgba(214,123,44,0.55); }
  body[data-cat="cakes"]    { --accent:#9C4368; --wash:rgba(156,67,104,0.10);  --line:rgba(156,67,104,0.5); }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ color-scheme:light; }
  html,body{ margin:0; padding:0; background:#fff !important; color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body{ padding-bottom:80px; }

  .topbar{ position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
    padding:10px 16px; background:rgba(255,255,255,0.93); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--hair); }
  .pill{ display:flex; align-items:center; gap:7px; background:none; border:1px solid var(--hair);
    border-radius:999px; padding:7px 13px; font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink); cursor:pointer; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:0 0 8px; }
  .chev{ font-size:9px; color:var(--muted); }
  .spacer{ flex:1; }
  .awake{ color:var(--muted); }
  .awake .dot{ background:var(--muted); }
  .awake.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .awake.on .dot{ background:#fff; }

  .sheet-wrap{ position:fixed; inset:0; z-index:100; background:rgba(28,26,24,0.3); display:none; align-items:flex-end; }
  .sheet-wrap.open{ display:flex; }
  .sheet{ width:100%; background:#fff; border-radius:18px 18px 0 0;
    padding:8px 10px calc(16px + env(safe-area-inset-bottom)); max-height:82vh; display:flex; flex-direction:column; }
  .sheet h4{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--muted); margin:12px 14px 8px; font-weight:500; }
  .opt{ display:flex; align-items:center; gap:12px; width:100%; background:none; border:none;
    padding:14px; border-radius:12px; font-size:16px; color:var(--ink); cursor:pointer; text-align:left; }
  .opt:active{ background:var(--tint); }
  .swatch{ width:15px; height:15px; border-radius:5px; flex:0 0 15px; }
  .opt .check{ margin-left:auto; color:var(--muted); font-size:14px; opacity:0; }
  .opt.sel .check{ opacity:1; }
  .srch{ margin:4px 12px 8px; }
  .srch input{ width:100%; padding:13px 14px; border:1px solid var(--hair); border-radius:11px;
    font-size:16px; color:var(--ink); background:var(--tint); }
  .srch input:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .liblist{ overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
  .libgrp{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--muted); margin:14px 14px 6px; }
  .libitem{ display:flex; align-items:center; width:100%; background:none; border:none;
    padding:13px 14px; border-radius:11px; font-size:16px; color:var(--ink); cursor:pointer; text-align:left; }
  .libitem:active{ background:var(--tint); }
  .libitem .plus{ margin-left:auto; color:var(--accent); font-size:19px; }
  .libitem[disabled]{ opacity:0.32; }

  /* ---------- loading ---------- */
  .loading{ padding:80px 20px; text-align:center; font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--muted); }

  /* ---------- collection ---------- */
  .col-head{ padding:26px 20px 4px; }
  .col-head h2{ font-family:'Fraunces',serif; font-weight:600; font-size:29px; margin:0 0 5px; letter-spacing:-0.015em; }
  .col-head .cnt{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:0.05em; }
  .csec{ padding:22px 20px 0; }
  .csec + .csec{ margin-top:6px; }
  .clabel{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.13em;
    text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  .recent{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .rcard{ border:1px solid var(--hair); border-radius:14px; overflow:hidden; background:none;
    padding:0; text-align:left; cursor:pointer; display:block; }
  .rcard:active{ background:var(--tint); }
  .thumb{ width:100%; aspect-ratio:1/1; position:relative; display:flex; align-items:flex-end;
    justify-content:flex-start; }
  .thumb .cam{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.1em;
    text-transform:uppercase; color:rgba(28,26,24,0.3); }
  .rcard .m{ padding:11px 12px 13px; }
  .rcard .m .cat{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:0.1em;
    text-transform:uppercase; margin-bottom:4px; }
  .rcard .m .t{ font-family:'Fraunces',serif; font-size:15px; line-height:1.25; }
  .newbtn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:16px; background:none; border:1.5px dashed var(--hair); border-radius:13px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.07em;
    text-transform:uppercase; color:var(--accent); cursor:pointer; margin-bottom:16px; }
  .newbtn:active{ background:var(--tint); }
  .rrow{ display:flex; align-items:center; gap:14px; width:100%; background:none; border:none;
    border-bottom:1px solid var(--hair); padding:13px 2px; cursor:pointer; text-align:left; }
  .rrow:active{ background:var(--tint); }
  .rrow .th{ width:58px; height:58px; border-radius:11px; flex:0 0 58px; position:relative; }
  .rrow .info{ flex:1; min-width:0; }
  .rrow .n{ font-family:'Fraunces',serif; font-size:17px; line-height:1.25; margin-bottom:3px; }
  .rrow .s{ font-size:13px; color:var(--muted); line-height:1.4; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .rrow .stat{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent);
    flex:0 0 auto; margin-left:4px; }

  /* ---------- recipe ---------- */
  .photo{ width:100%; aspect-ratio:16/10; position:relative; }
  .photo .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:rgba(28,26,24,0.3); }
  .head{ padding:22px 20px 6px; }
  .kicker{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--accent); margin-bottom:9px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:32px; line-height:1.1;
    margin:0 0 8px; letter-spacing:-0.015em; outline:none; }
  h1:focus{ border-bottom:1.5px solid var(--accent); }
  .sub{ font-size:15.5px; line-height:1.55; color:var(--muted); margin:0; outline:none; }
  .tags{ display:flex; gap:7px; flex-wrap:wrap; margin-top:14px; }
  .tag{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted); background:var(--tint); border-radius:5px; padding:5px 9px; }

  section{ padding:26px 20px 4px; }
  section + section{ border-top:1px solid var(--hair); margin-top:22px; }
  .slabel{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.13em;
    text-transform:uppercase; color:var(--muted); margin:0 0 16px; }
  .cards{ display:flex; gap:11px; margin-bottom:24px; }
  .card{ flex:1; border:1px solid var(--hair); border-radius:12px; padding:13px 15px; }
  .card .l{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .card .v{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; letter-spacing:-0.01em; }
  .card.accent .v{ color:var(--accent); }
  .wblock{ margin-bottom:22px; }
  .wtop{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .wtop .l{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--muted); }
  .wfield{ display:flex; align-items:baseline; gap:6px; }
  .wfield input{ width:92px; text-align:right; font-family:'IBM Plex Mono',monospace;
    font-size:25px; font-weight:600; color:var(--ink); background:none; border:none;
    border-bottom:1.5px solid var(--hair); padding:1px 3px 3px; }
  .wfield input:focus{ outline:none; border-bottom-color:var(--accent); }
  .wfield span{ font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--muted); }
  .yield{ display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--hair); border-radius:12px; padding:13px 15px; }
  .yield .l{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .yield .each{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .stepper{ display:flex; align-items:center; gap:2px; }
  .stepper button{ width:38px; height:38px; border-radius:10px; border:1px solid var(--hair);
    background:none; font-size:19px; color:var(--ink); cursor:pointer; display:flex;
    align-items:center; justify-content:center; line-height:1; }
  .stepper input{ width:46px; text-align:center; border:none; background:none;
    font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; color:var(--ink); }
  .stepper input:focus{ outline:none; }
  .seg{ display:flex; border:1px solid var(--hair); border-radius:11px; overflow:hidden; margin-bottom:22px; }
  .seg button{ flex:1; background:none; border:none; padding:12px 6px; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted); border-right:1px solid var(--hair); }
  .seg button:last-child{ border-right:none; }
  .seg button.on{ background:var(--accent); color:#fff; }
  .grp{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.13em;
    text-transform:uppercase; color:var(--muted); margin:24px 0 10px; }
  .grp:first-child{ margin-top:0; }
  .ftotal{ display:flex; align-items:baseline; justify-content:space-between;
    padding:0 2px 13px; border-bottom:1.5px solid var(--ink); margin-bottom:16px; }
  .ftotal .n{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; }
  .ftotal .f{ display:flex; align-items:baseline; gap:9px; font-family:'IBM Plex Mono',monospace; }
  .ftotal .pct{ font-size:12px; color:var(--muted); }
  .ftotal .g{ font-size:19px; font-weight:600; }
  .ftotal .u{ font-size:11px; color:var(--muted); }
  .ing{ margin-bottom:22px; }
  .ing-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px; padding:0 2px; gap:10px; }
  .ing-name{ font-family:'Fraunces',serif; font-size:17px; flex:1; min-width:0; }
  .ing-name .hint{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
    color:var(--muted); margin-top:2px; }
  .ing-f{ display:flex; align-items:baseline; gap:9px; font-family:'IBM Plex Mono',monospace; flex:0 0 auto; }
  .ing-f .pct{ font-size:12.5px; color:var(--accent); font-weight:500; min-width:44px; text-align:right; }
  .ing-f .g{ font-size:18px; font-weight:600; min-width:54px; text-align:right; }
  .ing-f .u{ font-size:11px; color:var(--muted); }
  .spoon{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted);
    text-align:right; margin:-4px 2px 7px; }
  .rm{ background:none; border:none; color:var(--muted); font-size:17px; padding:0 0 0 4px; cursor:pointer; line-height:1; }
  .bar{ position:relative; height:52px; }
  .bar .track{ position:absolute; inset:0; background:var(--tint); border:1px solid var(--hair); border-radius:14px; }
  .bar .fill{ position:absolute; left:0; top:0; bottom:0; min-width:3px; background:var(--wash);
    border:1.5px solid var(--line); border-radius:14px; pointer-events:none; transition:width 0.06s linear; }
  .bar input[type=range]{ position:absolute; inset:0; width:100%; height:52px; margin:0; padding:0;
    background:transparent; -webkit-appearance:none; appearance:none; touch-action:none; z-index:3; outline:none !important; }
  .bar input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none !important; width:44px; height:52px;
    background:transparent !important; border:none !important; box-shadow:none !important; }
  .bar input[type=range]::-moz-range-thumb{ width:44px; height:52px; background:transparent !important;
    border:none !important; box-shadow:none !important; }
  .bar input[type=range]::-moz-range-track{ background:transparent !important; border:none !important; }
  .bar .ends{ position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 13px; pointer-events:none; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted); }
  .bar.slim{ height:40px; }
  .bar.slim input[type=range]{ height:40px; }
  .bar.slim input[type=range]::-webkit-slider-thumb{ height:40px; }
  .bar.slim .track,.bar.slim .fill{ border-radius:11px; }
  .nested{ margin-top:14px; }
  .nested-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .nested-top .l{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.07em;
    text-transform:uppercase; color:var(--muted); }
  .nested-top .v{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; }
  .addbtn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:15px; margin-top:6px; background:none; border:1.5px dashed var(--hair); border-radius:13px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.07em;
    text-transform:uppercase; color:var(--accent); cursor:pointer; }
  .empty{ text-align:center; padding:18px 10px 6px; color:var(--muted); font-size:14.5px; line-height:1.5; }
  .dtotal{ display:flex; align-items:baseline; justify-content:space-between; padding-top:16px;
    border-top:1px solid var(--hair); margin-top:6px; }
  .dtotal .l{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--muted); }
  .dtotal .v{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; }
  .stp{ display:flex; gap:15px; padding:17px 0; border-bottom:1px solid var(--hair); }
  .stp:last-of-type{ border-bottom:none; }
  .stp-n{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--accent);
    flex:0 0 18px; padding-top:4px; font-weight:600; }
  .stp-t{ font-size:16px; line-height:1.6; }
  .timer{ display:inline-flex; align-items:center; gap:7px; margin-top:11px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--accent); background:var(--wash); border:none;
    border-radius:9px; padding:10px 15px; cursor:pointer; }
  .bake{ display:flex; gap:34px; }
  .bake .n{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; }
  .bake .l{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .bake-note{ font-size:15px; line-height:1.6; color:var(--muted); margin-top:15px; }
  .notes{ font-size:16px; line-height:1.65; outline:none; }
  .print{ display:flex; align-items:center; justify-content:center; gap:8px; width:calc(100% - 40px);
    margin:30px 20px 0; padding:16px; background:var(--ink); color:#fff; border:none;
    border-radius:13px; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    letter-spacing:0.09em; text-transform:uppercase; cursor:pointer; }
  .print.export{ margin-top:10px; background:none; color:var(--ink); border:1px solid var(--hair); }
  .stamp{ display:block; margin:18px 20px 0; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); }
  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:0; pointer-events:none;
    transition:all 0.2s ease; z-index:200; max-width:88vw; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .hidden{ display:none !important; }
</style>
</head>
<body data-cat="sourdough">

<div class="topbar">
  <button class="pill hidden" id="backBtn">← Back</button>
  <button class="pill" id="catBtn"><span class="dot"></span><span id="catLabel">Sourdough</span><span class="chev">▼</span></button>
  <div class="spacer"></div>
  <button class="pill awake" id="awakeBtn"><span class="dot"></span><span id="awakeLabel">Keep screen on</span></button>
</div>

<div class="sheet-wrap" id="catMenu"><div class="sheet"><h4>Category</h4><div id="catOpts"></div></div></div>
<div class="sheet-wrap" id="libMenu"><div class="sheet"><h4>Add ingredient</h4>
  <div class="srch"><input type="text" id="libSearch" placeholder="Search ingredients…" autocomplete="off"></div>
  <div class="liblist" id="libList"></div></div></div>

<!-- LOADING -->
<div class="loading" id="loading">Loading formulas…</div>

<!-- COLLECTION -->
<div id="colView" class="hidden">
  <div class="col-head"><h2 id="colTitle"></h2><div class="cnt" id="colCount"></div></div>
  <div class="csec hidden" id="recentSec">
    <div class="clabel">Recently opened</div>
    <div class="recent" id="recentGrid"></div>
  </div>
  <div class="csec">
    <div class="clabel" id="allLabel">All recipes</div>
    <button class="newbtn" id="newBtn">+ New recipe</button>
    <div id="recipeList"></div>
  </div>
</div>

<!-- RECIPE -->
<div id="recView" class="hidden">
  <div class="photo" id="photo"><div class="ph">Add a photo</div></div>
  <div class="head">
    <div class="kicker" id="kicker"></div>
    <h1 id="title" contenteditable="true" spellcheck="false"></h1>
    <p class="sub" id="subtitle" contenteditable="true" spellcheck="false"></p>
    <div class="tags" id="tags"></div>
  </div>
  <section>
    <div class="slabel">Batch</div>
    <div class="cards">
      <div class="card"><div class="l" id="c1l"></div><div class="v" id="c1v"></div></div>
      <div class="card accent"><div class="l" id="c2l"></div><div class="v" id="c2v"></div></div>
    </div>
    <div class="wblock">
      <div class="wtop"><div class="l">Total batch weight</div>
        <div class="wfield"><input type="number" id="wInput"><span>g</span></div></div>
      <div class="bar"><div class="track"></div><div class="fill" id="wFill"></div>
        <div class="ends"><span>200</span><span>6000</span></div>
        <input type="range" id="wSlider" min="200" max="6000" step="10"></div>
    </div>
    <div class="yield">
      <div><div class="l" id="yieldLabel"></div><div class="each" id="each"></div></div>
      <div class="stepper"><button id="minus">−</button><input type="number" id="items" min="1" max="60"><button id="plus">+</button></div>
    </div>
  </section>
  <section>
    <div class="slabel">Formula · drag to adjust</div>
    <div id="segWrap"></div>
    <div id="ledger"></div>
    <button class="addbtn" id="addBtn">+ Add ingredient</button>
    <div class="dtotal"><div class="l">Total</div><div class="v" id="dTotal"></div></div>
  </section>
  <section><div class="slabel">Method</div><div id="method"></div></section>
  <section><div class="slabel">Bake</div><div class="bake" id="bake"></div><div class="bake-note" id="bakeNote"></div></section>
  <section><div class="slabel">Notes</div><div class="notes" id="notes" contenteditable="true" spellcheck="false"></div></section>
  <button class="print" id="printBtn">Print formula sheet</button>
  <button class="print export" id="exportBtn">Export recipe</button>
  <span class="stamp" id="stamp"></span>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

/* ============ RECIPE DATA ============ */
function R(id,t,s,g,w,n,ing,st,b1,b2,bl,bn,nt){
  return {id,t,s,g,w,n,ing,st,bake:[[b1,'Oven'],[b2,bl||'Minutes']],bn,nt,photo:null};
}

/* Recipes are loaded at runtime from /recipes/index.json + one JSON file per
   recipe (see loadRecipes below). RECIPES starts empty and is filled in
   before the collection screen first renders. */
let RECIPES = {sourdough:[],yeasted:[],pizza:[],pastry:[],cakes:[]};

const LIB_BY_NAME = Object.fromEntries(LIB.map(i=>[i.n,i.k]));

function ingKey(name){
  const k = LIB_BY_NAME[name];
  if(!k) console.warn('No ingredient library match for "'+name+'"');
  return k;
}

function recipeFromJSON(j){
  const ing = j.flours.map(f=>[ingKey(f.name),f.percent])
    .concat(j.ingredients.map(i=>[ingKey(i.name),i.percent,i.levainHydration]));
  const st = j.steps.map(s=>[s.text, s.timerSeconds ? 1 : 0, s.timerSeconds]);
  const timeLabel = j.bake.timeUnit ? j.bake.timeUnit.charAt(0).toUpperCase()+j.bake.timeUnit.slice(1) : 'Minutes';
  return R(j.id, j.name, j.summary, j.tags, j.yield.unitWeight, j.yield.count,
    ing, st, j.bake.tempC+'°C', String(j.bake.time), timeLabel, j.bake.notes, j.notes);
}

async function loadRecipes(){
  const idx = await fetch('recipes/index.json').then(r=>r.json());
  const files = await Promise.all(idx.recipes.map(entry=>
    fetch('recipes/'+entry.id+'.json').then(r=>r.json())));
  files.forEach(j=>{
    if(!RECIPES[j.category]) RECIPES[j.category]=[];
    RECIPES[j.category].push(recipeFromJSON(j));
  });
}

/* ============ EXPORT ============ */
const UNIT_BY_CAT = {sourdough:'loaf', yeasted:'loaf', pizza:'ball', pastry:'piece', cakes:'piece'};

function slugify(str){
  return str.toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'') || 'recipe';
}

function recipeToJSON(rec, cat){
  const id = cat+'-'+slugify(rec.t);
  const flours = rec.ing.filter(i=>META[i[0]].g==='flour')
    .map(i=>({name:META[i[0]].n, percent:i[1]}));
  const ingredients = rec.ing.filter(i=>META[i[0]].g!=='flour')
    .map(i=>{
      const m=META[i[0]], out={name:m.n, percent:i[1], group:m.g};
      if(m.levain){ out.isLevain=true; out.levainHydration=i[2]!=null?i[2]:100; }
      return out;
    });
  const steps = rec.st.map(s=>{
    const step={text:s[0]};
    if(s[2]) step.timerSeconds=s[2];
    return step;
  });
  return {
    id, name:rec.t, category:cat, tags:rec.g.slice(),
    photo:'photos/'+id+'.jpg', summary:rec.s,
    yield:{count:rec.n, unit:UNIT_BY_CAT[cat], unitWeight:rec.w},
    flours, ingredients, steps,
    bake:{tempC:parseInt(rec.bake[0][0],10), time:parseFloat(rec.bake[1][0]),
      timeUnit:(rec.bake[1][1]||'Minutes').toLowerCase(), notes:rec.bn},
    notes:rec.nt
  };
}

function exportRecipe(){
  if(!S.rec) return;
  const json = recipeToJSON(S.rec, S.cat);
  const blob = new Blob([JSON.stringify(json,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=json.id+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported '+json.id+'.json');
}

/* ============ CUSTOM RECIPE PERSISTENCE ============ */
const CUSTOM_KEY = 'bakingFormulas.customRecipes';
function saveCustom(){
  try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); }
  catch(e){ console.warn('Could not save custom recipes to localStorage', e); }
}
function loadCustomFromStorage(){
  try{
    const raw = localStorage.getItem(CUSTOM_KEY); if(!raw) return;
    const saved = JSON.parse(raw);
    Object.keys(custom).forEach(cat=>{ if(Array.isArray(saved[cat])) custom[cat]=saved[cat]; });
  } catch(e){ console.warn('Could not load custom recipes from localStorage', e); }
}
function persistIfCustom(){
  if(S.rec && typeof S.rec.id==='string' && S.rec.id.startsWith('custom-')) saveCustom();
}

const r=(n,d=0)=>{const f=Math.pow(10,d);return Math.round(n*f)/f;};
const fmt=n=>n.toLocaleString('en-US');
function gDisp(g){ return g<10 ? r(g,1).toFixed(1) : fmt(r(g)); }
function frac(n){ const w=Math.floor(n); let q=Math.round((n-w)*4)/4; let ww=w;
  if(q===1){ww++;q=0;} const m={0:'',0.25:'¼',0.5:'½',0.75:'¾'};
  if(ww===0) return m[q]||'0'; return ww+(q?' '+m[q]:''); }
function spoons(g,tsp){ if(!tsp) return ''; if(g<0.35) return 'a pinch';
  const t=g/tsp; if(t<3) return '≈ '+frac(t)+' tsp';
  const tb=t/3; if(tb<=8) return '≈ '+frac(tb)+' tbsp'; return ''; }
const meta=k=>META[k];
const flours=()=>S.ing.filter(i=>meta(i.k).g==='flour');
const nonFlourSum=()=>S.ing.filter(i=>meta(i.k).g!=='flour').reduce((s,i)=>s+i.p,0);
const flourWeight=()=>flours().length? S.dough/((100+nonFlourSum())/100) : 0;
const stepFor=k=>meta(k).max<=10?0.1:1;
const allRecipes=c=>RECIPES[c].concat(custom[c]);

function tint(cat,i){ const c=CATS[cat].colour;
  const a=[0.10,0.18,0.26][i%3];
  return 'linear-gradient(145deg, rgba(28,26,24,0.04), '+hexA(c,a)+')'; }
function hexA(h,a){ const n=parseInt(h.slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

function setFlour(key,val){
  const fl=flours(), t=fl.find(f=>f.k===key);
  val=Math.max(0,Math.min(100,val));
  const others=fl.filter(f=>f!==t); t.p=val;
  if(!others.length){ t.p=100; return; }
  const remain=100-val, os=others.reduce((s,f)=>s+f.p,0);
  if(os===0){ others[0].p=remain; others.slice(1).forEach(f=>f.p=0); }
  else others.forEach(f=>f.p=Math.round(remain*(f.p/os)));
  const d=100-fl.reduce((s,f)=>s+f.p,0);
  if(d!==0){ const fix=others.reduce((a,b)=>a.p>=b.p?a:b); fix.p=Math.max(0,fix.p+d); }
}

  $('recView').classList.add('hidden');
  $('backBtn').classList.add('hidden');
  $('catBtn').classList.remove('hidden');

  $('colCount').textContent=list.length+' formulas';
  $('allLabel').textContent='All '+C.label.toLowerCase();

  if(RECENT.length>=1){
    $('recentSec').classList.remove('hidden');
    $('recentGrid').innerHTML=RECENT.slice(0,2).map((rc,ix)=>{
      const rec=allRecipes(rc.cat).find(x=>x.id===rc.id); if(!rec) return '';
      return '<button class="rcard" data-open="'+rc.cat+'|'+rc.id+'">'+
        '<div class="thumb" style="background:'+tint(rc.cat,ix)+'"><div class="cam">Add photo</div></div>'+

        '<div class="t">'+rec.t+'</div></div></button>';
    }).join('');
  } else $('recentSec').classList.add('hidden');

  $('recipeList').innerHTML=list.map((rec,ix)=>{
    const fl=rec.ing.filter(x=>meta(x[0]) && meta(x[0]).g==='flour').length;
    const liq=rec.ing.filter(x=>meta(x[0]) && meta(x[0]).g==='liquid').reduce((s,x)=>s+x[1],0);
    const stat = liq>0 ? liq+'%' : rec.ing.length+' ing';
    return '<button class="rrow" data-open="'+S.cat+'|'+rec.id+'">'+
      '<div class="th" style="background:'+tint(S.cat,ix)+'"></div>'+
      '<div class="info"><div class="n">'+rec.t+'</div><div class="s">'+rec.s+'</div></div>'+
      '<div class="stat">'+stat+'</div></button>';
  }).join('');

  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const [c,id]=b.dataset.open.split('|'); openRecipe(c,id); });
}

function openRecipe(cat,id){
  const rec=allRecipes(cat).find(x=>x.id===id); if(!rec) return;
  S.cat=cat; S.rec=rec; document.body.dataset.cat=cat;
  S.ing=rec.ing.map(x=>({k:x[0],p:x[1],lh:x[2]||100}));
  S.items=rec.n; S.dough=rec.n*rec.w; S.leaven='levain';
  RECENT=RECENT.filter(x=>!(x.cat===cat&&x.id===id)); RECENT.unshift({cat,id});
  RECENT=RECENT.slice(0,6);
  S.view='rec';
  $('colView').classList.add('hidden');
  $('recView').classList.remove('hidden');
  $('backBtn').classList.remove('hidden');
  $('catBtn').classList.add('hidden');
  window.scrollTo(0,0);
  buildRecipe(); buildLedger(); update();
}

function newRecipe(){
  const C=CATS[S.cat];
  const rec=R('custom-'+Date.now(),'Untitled '+C.label,'Tap to describe this bake.',['new'],

/* ============ RECIPE SCREEN ============ */
function buildRecipe(){
  const C=CATS[S.cat], rec=S.rec;
  $('kicker').textContent=C.label;
  $('title').textContent=rec.t;
  $('subtitle').textContent=rec.s;
  $('tags').innerHTML=rec.g.map(t=>'<span class="tag">'+t+'</span>').join('');
  $('yieldLabel').textContent=C.noun;
  $('photo').style.background=tint(S.cat,0);
  $('method').innerHTML=rec.st.map((s,i)=>
    '<div class="stp"><div class="stp-n">'+(i+1)+'</div><div><div class="stp-t">'+s[0]+'</div>'+
    (s[1]?'<button class="timer">▸ Set timer</button>':'')+'</div></div>').join('');
  $('bake').innerHTML=rec.bake.map(b=>'<div><div class="n">'+b[0]+'</div><div class="l">'+b[1]+'</div></div>').join('');
  $('bakeNote').textContent=rec.bn;
  $('notes').textContent=rec.nt;
  $('stamp').textContent='Updated 30 Jul 2026';
  if(C.leavenChoice){
    $('segWrap').innerHTML='<div class="seg">'+['levain','yeast','both'].map(m=>
      '<button data-lv="'+m+'"'+(S.leaven===m?' class="on"':'')+'>'+
      (m==='levain'?'Levain':m==='yeast'?'Yeast':'Both')+'</button>').join('')+'</div>';
    $('segWrap').querySelectorAll('button').forEach(b=>b.onclick=()=>setLeaven(b.dataset.lv));
  } else $('segWrap').innerHTML='';
  document.querySelectorAll('.timer').forEach(b=>b.onclick=()=>toast('Timers get wired up in the full app'));
  $('title').oninput=()=>{ rec.t=$('title').textContent; persistIfCustom(); };
  $('subtitle').oninput=()=>{ rec.s=$('subtitle').textContent; persistIfCustom(); };
  $('notes').oninput=()=>{ rec.nt=$('notes').textContent; persistIfCustom(); };
}

function setLeaven(mode){
  S.leaven=mode;
  S.ing=S.ing.filter(i=>i.k!=='levain'&&i.k!=='idy');
  const si=S.ing.findIndex(i=>meta(i.k).g==='salt'), add=[];
  if(mode==='levain') add.push({k:'levain',p:12,lh:100});
  if(mode==='yeast') add.push({k:'idy',p:0.2,lh:100});
  if(mode==='both'){ add.push({k:'levain',p:8,lh:100}); add.push({k:'idy',p:0.1,lh:100}); }
  if(si>=0) S.ing.splice(si,0,...add); else S.ing.push(...add);
  buildRecipe(); buildLedger(); update();
}

function canRemove(k){ return meta(k).g!=='flour' || flours().length>1; }

function buildLedger(){
  const L=$('ledger'); L.innerHTML='';
  if(!S.ing.length){
    L.innerHTML='<div class="empty">No ingredients yet.<br>Add your first one below.</div>'; return;
  }
  GROUPS.forEach(gr=>{
    const items=S.ing.filter(i=>meta(i.k).g===gr); if(!items.length) return;
    const h=document.createElement('div'); h.className='grp'; h.textContent=GRP_LABEL[gr]; L.appendChild(h);
    if(gr==='flour'){ const ft=document.createElement('div'); ft.className='ftotal';
      ft.innerHTML='<div class="n">Total flour</div><div class="f"><span class="pct">100%</span>'+
        '<span class="g" id="fTotal">0</span><span class="u">g</span></div>'; L.appendChild(ft); }
    items.forEach(it=>{
      const m=meta(it.k), st=stepFor(it.k), mx=m.g==='flour'?100:m.max;
      const row=document.createElement('div'); row.className='ing';
      row.innerHTML='<div class="ing-top"><div class="ing-name">'+m.n+
        (m.levain?'<span class="hint" data-lh="'+it.k+'"></span>':'')+'</div>'+
        '<div class="ing-f"><span class="pct" data-pct="'+it.k+'"></span>'+
        '<span class="g" data-g="'+it.k+'"></span><span class="u">g</span></div>'+
        (canRemove(it.k)?'<button class="rm" data-rm="'+it.k+'">✕</button>':'')+'</div>'+
        (m.tsp?'<div class="spoon" data-sp="'+it.k+'"></div>':'')+
        '<div class="bar"><div class="track"></div><div class="fill" data-fill="'+it.k+'"></div>'+
        '<div class="ends"><span>0%</span><span>'+mx+'%</span></div>'+
        '<input type="range" data-s="'+it.k+'" min="0" max="'+mx+'" step="'+st+'"></div>'+
        (m.levain?'<div class="nested"><div class="nested-top"><div class="l">Levain hydration</div>'+
        '<div class="v" data-lhv="'+it.k+'"></div></div><div class="bar slim"><div class="track"></div>'+
        '<div class="fill" data-lhfill="'+it.k+'"></div><div class="ends"><span>50%</span><span>160%</span></div>'+
        '<input type="range" data-lhs="'+it.k+'" min="50" max="160" step="5"></div></div>':'');
      L.appendChild(row);
    });
  });
  L.querySelectorAll('[data-s]').forEach(sl=>sl.oninput=e=>{
    const k=e.target.dataset.s, v=parseFloat(e.target.value);
    if(meta(k).g==='flour') setFlour(k,v); else S.ing.find(i=>i.k===k).p=v;
    syncRec(); update(); });
  L.querySelectorAll('[data-lhs]').forEach(sl=>sl.oninput=e=>{
    S.ing.find(i=>i.k===e.target.dataset.lhs).lh=parseInt(e.target.value); syncRec(); update(); });
  L.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    S.ing=S.ing.filter(i=>i.k!==b.dataset.rm); syncRec(); buildLedger(); update(); });
}
function syncRec(){ if(S.rec) S.rec.ing=S.ing.map(i=>[i.k,i.p,i.lh]); persistIfCustom(); }

function update(){
  const C=CATS[S.cat], F=flourWeight();
  let liquid=0, fat=0, lf=0, lw=0;
  S.ing.forEach(it=>{
    const m=meta(it.k), g=F*it.p/100;
    const pe=document.querySelector('[data-pct="'+it.k+'"]'); if(!pe) return;
    pe.textContent=(stepFor(it.k)===0.1?it.p.toFixed(1):Math.round(it.p))+'%';
    document.querySelector('[data-g="'+it.k+'"]').textContent=gDisp(g);
    const sp=document.querySelector('[data-sp="'+it.k+'"]'); if(sp) sp.textContent=spoons(g,m.tsp);
    const mx=m.g==='flour'?100:m.max;
    document.querySelector('[data-fill="'+it.k+'"]').style.width=Math.max(0,Math.min(100,(it.p/mx)*100))+'%';
    const sl=document.querySelector('[data-s="'+it.k+'"]'); if(sl) sl.value=it.p;
    if(m.g==='liquid') liquid+=g;
    if(m.g==='fat') fat+=g;
    if(m.levain){ lf=g/(1+it.lh/100); lw=lf*it.lh/100;
      const a=document.querySelector('[data-lhv="'+it.k+'"]'); if(a) a.textContent=it.lh+'%';
      const b=document.querySelector('[data-lh="'+it.k+'"]'); if(b) b.textContent=it.lh+'% hydration starter';
      const c=document.querySelector('[data-lhfill="'+it.k+'"]'); if(c) c.style.width=((it.lh-50)/110*100)+'%';
      const d=document.querySelector('[data-lhs="'+it.k+'"]'); if(d) d.value=it.lh; }
  });
  const ft=$('fTotal'); if(ft) ft.textContent=fmt(r(F));
  $('dTotal').textContent=fmt(r(S.dough))+' g';
  if(!F){ $('c1l').textContent='Total flour'; $('c1v').textContent='—';
          $('c2l').textContent='Ingredients'; $('c2v').textContent=S.ing.length; }
  else if(CATS[S.cat].builder){
    $('c1l').textContent='Total flour'; $('c1v').textContent=fmt(r(F))+' g';
    $('c2l').textContent='Fat ratio'; $('c2v').textContent=r(fat/F*100,1).toFixed(1)+'%';
  } else {
    $('c1l').textContent='General hyd.'; $('c1v').textContent=(liquid/F*100).toFixed(1)+'%';
    $('c2l').textContent='True hyd.'; $('c2v').textContent=(((liquid+lw)/(F+lf))*100).toFixed(1)+'%';
  }
  $('wFill').style.width=((S.dough-200)/5800*100)+'%';
  if(document.activeElement!==$('wSlider')) $('wSlider').value=S.dough;
  if(document.activeElement!==$('wInput')) $('wInput').value=r(S.dough);
  if(document.activeElement!==$('items')) $('items').value=S.items;
  $('each').textContent=fmt(r(S.dough/S.items))+' g each';
}

/* ============ CONTROLS ============ */
$('wSlider').oninput=e=>{S.dough=+e.target.value;update();};
$('wInput').oninput=e=>{const v=parseInt(e.target.value); if(!isNaN(v)&&v>0){S.dough=Math.min(Math.max(v,200),6000);update();}};
$('items').oninput=e=>{const v=parseInt(e.target.value); if(!isNaN(v)&&v>0){S.items=Math.min(v,60);update();}};
$('plus').onclick=()=>{S.items=Math.min(S.items+1,60);update();};
$('minus').onclick=()=>{S.items=Math.max(S.items-1,1);update();};
$('printBtn').onclick=()=>window.print();
$('exportBtn').onclick=()=>exportRecipe();
$('backBtn').onclick=()=>showCollection();
$('newBtn').onclick=()=>newRecipe();

$('catOpts').innerHTML=Object.entries(CATS).map(([k,c])=>
  '<button class="opt" data-c="'+k+'"><span class="swatch" style="background:'+c.colour+'"></span>'+
  c.label+'<span class="check">✓</span></button>').join('');
function syncSel(){ document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('sel',b.dataset.c===S.cat)); }
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
  S.cat=b.dataset.c; document.body.dataset.cat=S.cat;
  $('catLabel').textContent=CATS[S.cat].label;
  syncSel(); $('catMenu').classList.remove('open'); showCollection(); window.scrollTo(0,0); });
$('catBtn').onclick=()=>{ syncSel(); $('catMenu').classList.add('open'); };
$('catMenu').onclick=e=>{ if(e.target===$('catMenu')) $('catMenu').classList.remove('open'); };

function renderLib(q){
  q=(q||'').toLowerCase().trim();
  const have=new Set(S.ing.map(i=>i.k)); let html='';
  GROUPS.forEach(gr=>{
    const items=LIB.filter(i=>i.g===gr&&(!q||i.n.toLowerCase().includes(q)));
    if(!items.length) return;
    html+='<div class="libgrp">'+GRP_LABEL[gr]+'</div>';
    items.forEach(i=>{ const has=have.has(i.k);
      html+='<button class="libitem" data-add="'+i.k+'"'+(has?' disabled':'')+'>'+i.n+
        '<span class="plus">'+(has?'✓':'+')+'</span></button>'; });
  });
  $('libList').innerHTML=html||'<div class="libgrp">No match</div>';
  $('libList').querySelectorAll('[data-add]').forEach(b=>{ if(b.disabled) return;
    b.onclick=()=>{ const k=b.dataset.add, m=meta(k);
      if(m.g==='flour'){ const share=flours().length?Math.round(100/(flours().length+1)):100;
        S.ing.push({k,p:share,lh:100}); setFlour(k,share); }
      else S.ing.push({k,p:m.d,lh:100});
      $('libMenu').classList.remove('open'); $('libSearch').value='';
      syncRec(); buildLedger(); update(); toast(m.n+' added'); }; });
}
$('addBtn').onclick=()=>{ renderLib(''); $('libMenu').classList.add('open'); };
$('libSearch').oninput=e=>renderLib(e.target.value);
$('libMenu').onclick=e=>{ if(e.target===$('libMenu')) $('libMenu').classList.remove('open'); };

let tT; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2400); }

let lock=null;
function awakeUI(on){ $('awakeBtn').classList.toggle('on',on);
  $('awakeLabel').textContent=on?'Screen on':'Keep screen on'; }
async function acquire(){ try{ lock=await navigator.wakeLock.request('screen');
  lock.addEventListener('release',()=>awakeUI(false)); awakeUI(true); toast('Screen will stay on'); }
  catch(e){ awakeUI(false); toast('Screen lock unavailable here'); } }
$('awakeBtn').onclick=async()=>{
  if(!('wakeLock' in navigator)){ toast('Not supported in this browser'); return; }
  if(lock){ await lock.release(); lock=null; awakeUI(false); toast('Screen lock off'); }
  else await acquire(); };
document.addEventListener('visibilitychange',async()=>{
  if(lock&&document.visibilityState==='visible') await acquire(); });

$('catLabel').textContent=CATS[S.cat].label;
syncSel();

(async function init(){
  try {
    await loadRecipes();
  } catch(err){
    console.error('Failed to load recipes', err);
    $('loading').textContent='Could not load recipes. Check the console.';
    return;
  }
  loadCustomFromStorage();
  $('loading').classList.add('hidden');
  $('colView').classList.remove('hidden');
  showCollection();
})();
</script>
</body>
</html>
