<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baking Formulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --kraft: #DFD3BC;
    --dust: #EFE7D6;
    --graphite: #2A2824;
    --rye: #7A6A52;
    --scorch: #8E3B18;

    --font-display: 'Bricolage Grotesque', sans-serif;
    --font-body: 'Newsreader', serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  html { font-size: 16px; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--kraft);
    color: var(--graphite);
    font-family: var(--font-body);
  }

  main {
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2.441rem; /* 1.25 scale from 16px base, ~4 steps up */
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }

  p.sub {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--rye);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
  }

  .accent {
    display: inline-block;
    width: 2.5rem;
    height: 2px;
    background: var(--scorch);
    margin: 1.25rem auto 0;
  }
</style>
</head>
<body>
<main>
  <h1>Baking Formulas</h1>
  <p class="sub">grams &middot; percent &middot; formula</p>
  <div class="accent"></div>
</main>
</body>
</html>
